name: isolated
description: Isolated profile for GUI applications with LXG
config:
  boot.autostart: 'true'
  raw.idmap: both :UID :UID
devices:
  gpu:
    type: gpu
  lxg-binary:
    type: disk
    source: /usr/local/bin/lxg
    path: /usr/local/bin/lxg
  lxg-run:
    type: disk
    source: /run/user/:UID/lxg
    path: /lxg/run/user/:UID
    recursive: 'true'