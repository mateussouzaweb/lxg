name: integrated
description: Integrated profile for GUI applications with LXG
config:
  environment.LXG_CONTAINER: 1
  environment.LXG_INTEGRATED: 1
  boot.autostart: 'true'
  raw.idmap: both :UID :UID
  security.nesting: 'true'
  security.syscalls.intercept.mknod: 'true'
  security.syscalls.intercept.setxattr: 'true'
devices:
  gpu:
    type: gpu
  home-share:
    type: disk
    source: /home/:USER
    path: /host/home/:USER
  lxg-binary:
    type: disk
    source: /usr/local/bin/lxg
    path: /usr/local/bin/lxg
  lxg-dbus-socket:
    type: disk
    source: /run/user/:UID/lxg.bus
    path: /lxg/run/user/:UID/lxg.bus
  lxg-bridge-socket:
    type: disk
    source: /run/user/:UID/lxg.bridge
    path: /lxg/run/user/:UID/lxg.bridge
  wayland-socket:
    type: disk
    source: /run/user/:UID/wayland-0
    path: /lxg/run/user/:UID/wayland-0
  pipewire-socket:
    type: disk
    source: /run/user/:UID/pipewire-0
    path: /lxg/run/user/:UID/pipewire-0
  pulse-socket:
    type: disk
    source: /run/user/:UID/pulse/native
    path: /lxg/run/user/:UID/pulse/native
  x11-socket:
    type: disk
    source: /tmp/.X11-unix
    path: /lxg/tmp/.X11-unix
    required: 'false'
