name: privileged
description: Privileged profile for GUI applications with LXG
config:
  boot.autostart: 'true'
  security.privileged: 'true'
  security.nesting: 'true'
  raw.lxc: |
    lxc.namespace.keep = net ipc
    lxc.apparmor.profile = unconfined
    lxc.selinux.context = unconfined_t
devices:
  gpu:
    type: gpu
  lxg-binary:
    type: disk
    source: /usr/local/bin/lxg
    path: /usr/local/bin/lxg
  lxg-run:
    type: disk
    source: /run/user/:UID/lxg
    path: /lxg/run/user/:UID
    recursive: 'true'
  lxg-home:
    type: disk
    source: /home/:USER
    path: /lxg/home/:USER