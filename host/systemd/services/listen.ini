[Unit]
Description=LXG Listen Service
Requires=dbus.socket
After=dbus.socket graphical-session.target

[Service]
Type=simple
ExecStart=/usr/local/bin/lxg listen
Restart=on-failure
RestartSec=1s
PassEnvironment=XDG_RUNTIME_DIR DBUS_SESSION_BUS_ADDRESS
StandardOutput=journal
StandardError=journal

[Install]
WantedBy=graphical-session.target